# Netlify publica public/ (el juego) y convierte netlify/functions/ en la API (/api)
[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Librería con archivos internos: se instala tal cual, sin empaquetarla
  external_node_modules = ["@google-cloud/firestore"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
